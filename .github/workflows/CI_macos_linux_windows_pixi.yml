name: CI - MacOS/Linux/Windows via Pixi

on:
  workflow_call:
    inputs:
      sofa-branch-name:
        type: string
        required: true
      sofa-commit-sha:
        type: string
        required: true
      pr-owner-url:
        type: string
        required: false
      pr-branch-name:
        type: string
        required: false
      pr-commit-sha:
        type: string
        required: false
      preset:
        type: string
        required: true
      python-version:
        type: string
        required: true
      ci-depends-on:
        type: string
        required: false
      with-all-tests:
        type: boolean
        required: false
        default: false
      force-full-build:
        type: boolean
        required: false
        default: false
      generate-binaries:
        type: boolean
        required: false
        default: false
      external-plugins:
        type: string
        required: false
      additionnal-cmake-flags:
        type: string
        required: false
      builder-os:
        type: string
        required: true
        default: '["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]'
      dash-info:
        type: string
        required: false
        default: 'NONE'
        description: 'Json scructure with three parameters {"COMMIT_HASH":"fullhsashofthecommit", }'

jobs:
  display-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Display
        shell: bash
        run: |
            echo "Build and test launched with following parameters:"
            echo "sofa-branch-name : ${{ inputs.sofa-branch-name }}"
            echo "sofa-commit-sha : ${{ inputs.sofa-commit-sha }}"
            echo "pr-owner-url : ${{ inputs.pr-owner-url }}"
            echo "pr-branch-name : ${{ inputs.pr-branch-name }}"
            echo "pr-commit-sha : ${{ inputs.pr-commit-sha }}"
            echo "preset : ${{ inputs.preset }}"
            echo "ci-depends-on : ${{ inputs.ci-depends-on }}"
            echo "with-all-tests : ${{ inputs.with-all-tests }}"
            echo "force-full-build : ${{ inputs.force-full-build }}"
            echo "generate-binaries : ${{ inputs.generate-binaries }}"
            echo "external-plugins : ${{ inputs.external-plugins }}"
            echo "additionnal-cmake-flags : ${{ inputs.additionnal-cmake-flags }}"
            echo "builder-os : ${{ inputs.builder-os }}"

            echo ""
            echo "The following python version has been passed : ${{ inputs.python-version }}"
            echo "--> only the default python version written in the pixi.toml can be used and will be forced here."
  sofa-pixi:
    strategy:
        fail-fast: false
        matrix:
          os: ${{ fromJson(inputs.builder-os) }}
          build_type: [Release]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - Env ${{ inputs.preset }} ${{ matrix.build_type }} ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sofa-branch-name }}
          path: sofa

      - run: git config --global user.email "<>"
      - run: git config --global user.name "SOFA Bot"

      - name: Setup SOFA and clone CI
        id: clone
        shell: bash -el {0}
        run: |
          export WORKSPACE=$GITHUB_WORKSPACE
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV

          export SRC_DIR=$GITHUB_WORKSPACE/sofa
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          if [ -d "$SRC_DIR" ]; then
              rm -rf "$SRC_DIR"
          fi

          if [ ! -z "${{ inputs.pr-owner-url }}" ]; then
              echo "This is a PR, merging branch ${{ inputs.pr-branch-name }} from remote ${{ inputs.pr-owner-url }} into origin branch ${{ inputs.sofa-branch-name }}"
              git clone -b ${{ inputs.sofa-branch-name }} --single-branch https://www.github.com/sofa-framework/sofa
              cd sofa
              git remote add pr ${{ inputs.pr-owner-url }}
              git fetch pr

              if [ "${{ inputs.pr-commit-sha }}" == "HEAD" ]; then
                  git merge ${{ inputs.pr-branch-name }}
              else
                  git merge ${{ inputs.pr-commit-sha }}
              fi
          else
              echo "This is not a PR: checking out sha ${{ inputs.sofa-commit-sha }} from branch ${{ inputs.sofa-branch-name }}"
              git clone -b ${{ inputs.sofa-branch-name }} --single-branch https://www.github.com/sofa-framework/sofa
              cd sofa
              git checkout ${{ inputs.sofa-commit-sha }}
          fi

          cd $WORKSPACE

          ## Clone CI and use ci-depends-on structure
          ci_branch=${{ inputs.sofa-branch-name }}
          ci_repo_url="https://www.github.com/sofa-framework/ci"


          # check if ci has a ci-depends-on
          ci_ci_depends_on=$(echo "${{ inputs.ci-depends-on }}" | jq .ci)
          if [ -n "${{ inputs.ci-depends-on }}" ] && [ "$ci_ci_depends_on" != "null" ]; then
              echo "ci-depends-on for ci repository detected."
              ci_repo_url=$(echo "${{ inputs.ci-depends-on }}" | jq .ci.repo_url)
              ci_branch=$(echo "${{ inputs.ci-depends-on }}" | jq .ci.branch_name)
          fi

          echo "CI_BRANCH=$ci_branch" >> $GITHUB_ENV


          echo "Cloning CI from remote ${ci_repo_url}, selecting branch ${ci_branch}"

          CI_DIR=$WORKSPACE/ci
          echo "CI_DIR=$CI_DIR" >> $GITHUB_ENV

          git clone -b ${ci_branch//\"} --single-branch ${ci_repo_url//\"}



          ## Clone Regression and use ci-depends-on structure
          regression_branch=${{ inputs.sofa-branch-name }}
          regression_repo_url="https://www.github.com/sofa-framework/Regression"


          # check if ci has a ci-depends-on
          regression_ci_depends_on=$(echo "${{ inputs.ci-depends-on }}" | jq .Regression)
          if [ -n "${{ inputs.ci-depends-on }}" ] && [ "$regression_ci_depends_on" != "null" ]; then
              echo "ci-depends-on for Regression repository detected."
              regression_repo_url=$(echo "${{ inputs.ci-depends-on }}" | jq .Regression.repo_url)
              regression_branch=$(echo "${{ inputs.ci-depends-on }}" | jq .Regression.branch_name)
          fi
          echo "REGRESSION_BRANCH=$regression_branch" >> $GITHUB_ENV


          echo "Cloning Regression from remote ${regression_repo_url}, selecting branch ${regression_branch}"

          REGRESSION_DIR=$WORKSPACE/Regression
          echo "REGRESSION_DIR=$REGRESSION_DIR" >> $GITHUB_ENV

          git clone -b ${regression_branch//\"} --single-branch ${regression_repo_url//\"}


          cd $WORKSPACE

          ## Setup build folder
          mkdir $WORKSPACE/build

          SOFA_BUILD_DIR=$WORKSPACE/build
          echo "SOFA_BUILD_DIR=$SOFA_BUILD_DIR" >> $GITHUB_ENV
          SOFA_INSTALL_PREFIX=$WORKSPACE/install
          echo "SOFA_INSTALL_PREFIX=$SOFA_INSTALL_PREFIX" >> $GITHUB_ENV

          if [ -n "${{ inputs.external-plugins }}" ]; then
              echo "Setting up external plugins."
              for plugin in ${{ inputs.external-plugins }}; do
                  plugin_base=${plugin%@*}
                  plugin_branch=${plugin##*@}
                  plugin_repo=$(basename "$plugin_base")

                  echo "Adding line 'sofa_add_external(plugin $plugin_repo GIT_REF $plugin_branch GIT_REPOSITORY $plugin_base ON)' to file ${SRC_DIR}/applications/CMakeLists.txt"
                  echo "sofa_add_external(plugin $plugin_repo GIT_REF $plugin_branch GIT_REPOSITORY $plugin_base ON)" >> "${SRC_DIR}/applications/CMakeLists.txt"
              done
          fi


      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: false
          manifest-path: sofa/pixi.toml
          environments: ${{ inputs.preset }}

      - name: Build SOFA [MacOS/Linux/Windows]
        id: build-step
        shell: bash -el {0}
        env:
          SOFA_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cd ${SRC_DIR}

          if [[ "${{ inputs.generate-binaries }}" == "true" ]]; then
            pixi run -e release-package-${{ inputs.preset }} configure-package
            pixi run -e release-package-${{ inputs.preset }} build-package
          else
            ## Deal with ci-depends-on
            # Loop over each key-value pair in the JSON avoiding ci repository if inside
            CMAKE_OPTIONS="${{inputs.additionnal-cmake-flags}}"
            for key in $(echo "${{ inputs.ci-depends-on }}" | jq -r 'keys[]' | grep -v '^ci$'); do

              repo_url=$(echo "${{ inputs.ci-depends-on }}" | jq -r ".\"$key\".repo_url")
              branch_name=$(echo "${{ inputs.ci-depends-on }}" | jq -r ".\"$key\".branch_name")

              # Format the CMake flags for this key and append to the result
              fixed_name=$(echo "$key" |  awk '{gsub(/\./, "_"); print toupper($0)}')
              flag_repository="-D${fixed_name}_GIT_REPOSITORY=\"$repo_url\""
              flag_tag="-D${fixed_name}_GIT_TAG=\"$branch_name\""

              # Append both flags to the result string with a space
              CMAKE_OPTIONS="$CMAKE_OPTIONS $flag_repository $flag_tag "
            done

            if [[ ! -n "$CMAKE_OPTIONS" ]]; then
                echo "No ci-depends-on detected."
            else
                echo "Adding the following cmake variable : $CMAKE_OPTIONS"
            fi

            ## Run build step
            pixi run -e ${{ inputs.preset }} configure $CMAKE_OPTIONS
            pixi run -e ${{ inputs.preset }} build
          fi

      - name: Setup env for tests
        shell: bash
        if: always() && runner.os == 'Windows' && inputs.generate-binaries == false
        run: |
          cd ${SRC_DIR}

          echo "Adding runtime related dependencies"
          pixi add $(cat ${CI_DIR}/docker/python_extra_dependencies.txt)
          pixi install -e ${{ inputs.preset }}

          echo "Refactoring environement variables to jump into powershell"
          PIXI_PREFIX="$(pwd -W)/.pixi/envs/${{ inputs.preset }}/"
          echo "VM_PYTHON3_EXECUTABLE=$PIXI_PREFIX/python.exe" >> $GITHUB_ENV
          echo "PIXI_PREFIX=$PIXI_PREFIX" >> $GITHUB_ENV

          . ${CI_DIR}/scripts/tests/setup-test-env.sh ${SOFA_BUILD_DIR} ${CI_DIR}/scripts default none


          echo "BUILD_DIR=$(cd "$SOFA_BUILD_DIR" && pwd -W)" >> $GITHUB_ENV
          echo "SRC_DIR=$(cd "$SRC_DIR" && pwd -W)" >> $GITHUB_ENV
          echo "CI_DIR=$(cd "$CI_DIR" && pwd -W)" >> $GITHUB_ENV
          echo "REGRESSION_DIR=$(cd "$REGRESSION_DIR" && pwd -W)" >> $GITHUB_ENV
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV
          echo "SOFA_ROOT=$SOFA_ROOT" >> $GITHUB_ENV
          echo "RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV
          echo "VM_MAX_PARALLEL_TESTS=$VM_MAX_PARALLEL_TESTS" >> $GITHUB_ENV


          if [[ "$RUNNER_OS" == "Windows" ]]; then
              #Activating pixi env in a git-bash terminal is broken, here we just want to consume it.

              echo "PIXI_PREFIX=$PIXI_PREFIX" >> $GITHUB_ENV

              echo "$PIXI_PREFIX" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/bin" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/Library/bin" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/Scripts" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/Library/mingw-w64/bin" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/Library/usr/bin" >> $GITHUB_PATH
              echo "$PIXI_PREFIX/sofa-build/bin/" >> $GITHUB_PATH
          fi

          exit 0

      - name: Unit tests
        id: unit-tests-step
        if: always() && runner.os == 'Windows' && steps.build-step.outcome == 'success' && inputs.generate-binaries == false
        shell: pwsh
        run: |
          Set-Location $env:SRC_DIR

          $UnitResultsDir = Join-Path $env:BUILD_DIR "tests_results\unit"
          $env:UNIT_RESULTS_DIR = $UnitResultsDir   # in case the script or child processes need it

          # Activate the environment in the terminal
          pixi shell-hook --shell powershell -e ${{ inputs.preset }} | Out-String | Invoke-Expression

          python "$env:CI_DIR\scripts\tests\sofa_unit_tests.py" `
            --build-dir "$env:BUILD_DIR" `
            --results-dir "$UnitResultsDir" `
            -j $env:VM_MAX_PARALLEL_TESTS

          if (-not (Test-Path "$UnitResultsDir\*summary*")) { exit 1 }

          $crashes  = $null
          $failures = $null
          foreach ($line in Get-Content "$UnitResultsDir\summary.txt") {
            $key, $value = $line -split '=', 2
            switch ($key) {
              'crashes'  { $crashes  = $value }
              'failures' { $failures = $value }
            }
          }

          if ($crashes  -ne '0') { exit 1 }
          if ($failures -ne '0') { exit 1 }

      - name: Scene tests
        id: scene-tests-step
        if: always() && runner.os == 'Windows' && steps.build-step.outcome == 'success' && inputs.generate-binaries == false && inputs.with-all-tests == true
        shell: pwsh
        run: |
          Set-Location $env:SRC_DIR

          $SceneResultsDir = Join-Path $env:BUILD_DIR "tests_results\scene"
          $env:SCENE_RESULTS_DIR = $SceneResultsDir   # in case the script or child processes need it

          # Activate the environment in the terminal
          pixi shell-hook --shell powershell -e ${{ inputs.preset }} | Out-String | Invoke-Expression

          python "$env:CI_DIR\scripts\tests\sofa_scene_tests.py" `
            --src-dir "$env:SRC_DIR" `
            --build-dir "$env:BUILD_DIR" `
            --results-dir "$SceneResultsDir" `
            -j $env:VM_MAX_PARALLEL_TESTS

          if (-not (Test-Path "$SceneResultsDir\*summary*")) { exit 1 }

          $crashes  = $null
          $failures = $null
          foreach ($line in Get-Content "$SceneResultsDir\summary.txt") {
            $key, $value = $line -split '=', 2
            switch ($key) {
              'crashes'  { $crashes  = $value }
              'failures' { $failures = $value }
            }
          }

          if ($crashes  -ne '0') { exit 1 }
          if ($failures -ne '0') { exit 1 }

      - name: Regression tests
        id: regression-tests-step
        if: always() && runner.os == 'Windows' && steps.build-step.outcome == 'success' && inputs.generate-binaries == false && inputs.with-all-tests == true
        shell: pwsh
        run: |
          Set-Location $env:SRC_DIR

          $RegResultsDir = Join-Path $env:BUILD_DIR "tests_results\regression"
          $env:REG_RESULTS_DIR = $RegResultsDir   # in case the script or child processes need it

          # Activate the environment in the terminal
          pixi shell-hook --shell powershell -e ${{ inputs.preset }} | Out-String | Invoke-Expression

          python "$env:REGRESSION_DIR\SofaRegressionProgram\SofaRegressionProgram.py" `
            --input "$env:SRC_DIR/examples" `
            --input "$env:SRC_DIR\applications" `
            --input "$env:BUILD_DIR\external_directories\fetched" `
            --output-logs-errors "$RegResultsDir" `
            --legacy-regression `
            -j $env:VM_MAX_PARALLEL_TESTS

          if (-not (Test-Path "$RegResultsDir\*summary*")) { exit 1 }

          $crashes  = $null
          $failures = $null
          foreach ($line in Get-Content "$RegResultsDir\summary.txt") {
            $key, $value = $line -split '=', 2
            switch ($key) {
              'crashes'  { $crashes  = $value }
              'failures' { $failures = $value }
            }
          }

          if ($crashes  -ne '0') { exit 1 }
          if ($failures -ne '0') { exit 1 }


      - name: Publish artifacts
        if: always() && steps.build-step.outcome == 'success' && inputs.generate-binaries == true
        uses: actions/upload-artifact@v4
        with:
          name: binaries_${{ matrix.os }}
          path: |
            ${{ env.SOFA_BUILD_DIR }}/SOFA_v*


      - name: Publish tests logs
        id: publish-tests-logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tests-logs_${{ matrix.os }}
          path: |
            ${{ env.SOFA_BUILD_DIR }}/tests_results/


      - name: Configure python for display
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          python3 -m pip install prettytable

      - name: Summarize results
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |

          bold="\033[1m"
          normal="\033[0m"
          if [[ "${{ steps.clone.outcome }}" == "failure" ]]; then
            echo "❌ Something went wrong during the clone steps..."
            echo -e "${bold}Please check those actions logs${normal}"
            exit 1
          else
            echo "✅ Setup OK."
          fi

          if [[ "${{ steps.build-step.outcome }}" == "failure" ]]; then
            echo "❌ Build step failed"
            echo -e "${bold}Please check those actions logs${normal}"
            exit 1
          else
            echo "✅ Build OK."
          fi

          if [[ "${{ inputs.generate-binaries }}" == "false" ]]; then
            if [[  "${{ steps.unit-tests-step.outcome }}" == "failure"          || "${{ steps.scene-tests-step.outcome }}" == "failure"           || "${{ steps.regression-tests-step.outcome }}" == "failure" ]] &&
               [[ -f "${{ env.SOFA_BUILD_DIR }}/tests_results/unit/summary.txt" && -f "${{ env.SOFA_BUILD_DIR }}/tests_results/scene/summary.txt" && -f "${{ env.SOFA_BUILD_DIR }}/tests_results/regression/summary.txt"  ]]; then
              echo "❌ Tests have resulted in : "
              echo ""
              python3 ${{ env.CI_DIR }}/scripts/tests/generate-tests-table.py "${{ env.SOFA_BUILD_DIR }}/tests_results/"
              echo ""
              echo "#----------------------------------------#"
              echo "#---------------Quick Logs---------------#"
              echo "#----------------------------------------#"
              for testType in 'unit' 'scene' 'regression';
                do
                  for errorType in 'errors' 'crashes' 'failures';
                  do
                    if [ -f "${{ env.SOFA_BUILD_DIR }}/tests_results/${testType}/${testType}_${errorType}.txt" ]; then
                      capitalized="$(echo "${testType:0:1}" | tr '[:lower:]' '[:upper:]')${testType:1}"
                      echo ""
                      echo -e "${bold}${capitalized} ${errorType}:${normal}"
                      echo ""
                      cat "${{ env.SOFA_BUILD_DIR }}/tests_results/${testType}/${testType}_${errorType}.txt"
                      echo ""
                      echo "#----------------------------------------#"
                    fi
                  done
                done
              echo -e "${bold}You can download all logs here : ${{ steps.publish-tests-logs.outputs.artifact-url }}${normal}"
              exit 1
            elif [[ "${{ steps.unit-tests-step.outcome }}" == "failure" || "${{ steps.scene-tests-step.outcome }}" == "failure" || "${{ steps.regression-tests-step.outcome }}" == "failure" ]]; then
              echo "❌ Something went wrong during one of the tests steps"
              echo -e "${bold}Please check this action logs, and download tests logs here: ${{ steps.publish-tests-logs.outputs.artifact-url }}${normal}"
              exit 1
            else
              echo "✅ Tests were successful : "
              echo ""
              python3 ${{ env.CI_DIR }}/scripts/tests/generate-tests-table.py "${{ env.SOFA_BUILD_DIR }}/tests_results/"
              echo ""
            fi
          fi
