name: Reboot builders

# ===============================================================
# ===============================================================


on:
  # On-demand binary generation
  workflow_dispatch:
    inputs:
      builder-os:
        type: choice
        description: On which OS run the binaries generation
        options:
        - '["sofa-ci-dev-ubuntu2404-0"]'
        - '["sofa-ci-dev-ubuntu2404-1"]'
        - '["sofa-ci-dev-ubuntu2404-2"]'
        - '["sofa-ci-dev-ubuntu2404-3"]'
        - '["sofa-ci-dev-ubuntu2404-4"]'
        - '["sofa-ci-dev-ubuntu2404-5"]'
        - '["sofa-ci-dev-ubuntu2404-6"]'
        - '["sofa-ci-dev-ubuntu2404-7"]'
        - '["consortium-macos-2-1"]'
        - '["consortium-macos-3-1"]'
        - '["sofa-ci-dev-ubuntu2404-0","sofa-ci-dev-ubuntu2404-1","sofa-ci-dev-ubuntu2404-2","sofa-ci-dev-ubuntu2404-3","sofa-ci-dev-ubuntu2404-4","sofa-ci-dev-ubuntu2404-5","sofa-ci-dev-ubuntu2404-6","sofa-ci-dev-ubuntu2404-7","consortium-macos-2-1","consortium-macos-3-1"]'
        - '["sofa-ci-dev-github-launcher-0-0","sofa-ci-dev-github-launcher-1-0","sofa-ci-dev-github-launcher-2-0","sofa-ci-dev-github-launcher-3-0"]'
        - '["sofa-ci-dev-ubuntu2404-0","sofa-ci-dev-ubuntu2404-1","sofa-ci-dev-ubuntu2404-2","sofa-ci-dev-ubuntu2404-3","sofa-ci-dev-ubuntu2404-4","sofa-ci-dev-ubuntu2404-5","sofa-ci-dev-ubuntu2404-6","sofa-ci-dev-ubuntu2404-7","consortium-macos-2-1","consortium-macos-3-1","sofa-ci-dev-github-launcher-0-0","sofa-ci-dev-github-launcher-1-0","sofa-ci-dev-github-launcher-2-0","sofa-ci-dev-github-launcher-3-0"]'
        default: '["sofa-ci-dev-ubuntu2404-0","sofa-ci-dev-ubuntu2404-1","sofa-ci-dev-ubuntu2404-2","sofa-ci-dev-ubuntu2404-3","sofa-ci-dev-ubuntu2404-4","sofa-ci-dev-ubuntu2404-5","sofa-ci-dev-ubuntu2404-6","sofa-ci-dev-ubuntu2404-7","consortium-macos-2-1","consortium-macos-3-1","sofa-ci-dev-github-launcher-0-0","sofa-ci-dev-github-launcher-1-0","sofa-ci-dev-github-launcher-2-0","sofa-ci-dev-github-launcher-3-0"]'



  # Nightly build
  schedule:
    - cron: '30 1 * * *'   # Evevery night @1:30 a.m.

# ===============================================================
# ===============================================================


jobs:
  # Filter build handling : push in master, commits in PR, comments in PR and dispatch
  reboot_builders_by_hand:
    if: ${{ github.event_name != 'schedule'}}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.builder-os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clear ccache
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
            if [[ -n "$BUILDER_CACHE_DIR" ]]; then
                rm -rf $BUILDER_CACHE_DIR/*
            fi

      - name: Reboot builder
        shell: bash
        run: |
            # WARNING: this command needs to add in /etc/sudoers this line:
            # ALL ALL=NOPASSWD: /usr/sbin/reboot, /usr/sbin/shutdown, /sbin/reboot, /sbin/shutdown
            echo '' | sudo -S /sbin/shutdown -r +1 &

  rebot_builder_nightly:
    if: ${{ github.event_name == 'schedule'}}
    strategy:
      fail-fast: false
      matrix:
        os: ["sofa-ci-dev-ubuntu2404-0","sofa-ci-dev-ubuntu2404-1","sofa-ci-dev-ubuntu2404-2","sofa-ci-dev-ubuntu2404-3","sofa-ci-dev-ubuntu2404-4","sofa-ci-dev-ubuntu2404-5","sofa-ci-dev-ubuntu2404-6","sofa-ci-dev-ubuntu2404-7","consortium-macos-2-1","consortium-macos-3-1","sofa-ci-dev-github-launcher-0-0","sofa-ci-dev-github-launcher-1-0","sofa-ci-dev-github-launcher-2-0","sofa-ci-dev-github-launcher-3-0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clear ccache
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
            if [[ -n "$BUILDER_CACHE_DIR" ]]; then
                rm -rf $BUILDER_CACHE_DIR/*
            fi

      - name: Reboot builder
        shell: bash
        run: |
            # WARNING: this command needs to add in /etc/sudoers this line:
            # ALL ALL=NOPASSWD: /usr/sbin/reboot, /usr/sbin/shutdown, /sbin/reboot, /sbin/shutdown
            echo '' | sudo -S /sbin/shutdown -r +1 &
